<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applications — DirectCredit</title>
<link rel="stylesheet" href="loan-request-eligibility.css">
</head>
<body>
<main class="content application-workspace">
  <header class="page-head">
    <div><h1>APPLICATIONS</h1><p>Customer and loan application workspace</p></div>
    <div class="head-actions"><button id="exportBtn">⇩ Download Report</button><button id="filterBtn">☰ Filter</button></div>
  </header>
  <nav class="application-tabs" aria-label="Application sections">
    <button class="application-tab" data-view="customer-profile"><span>♙</span><b>Customer Profile</b></button>
    <button class="application-tab" data-view="number-contact"><span>☎</span><b>Number &amp; Contact Details</b></button>
    <button class="application-tab active" data-view="bank-analysis"><span>▣</span><b>Bank Statement Analysis</b></button>
    <button class="application-tab" data-view="kyc-employment"><span>▤</span><b>KYC &amp; Employment Summary</b></button>
    <button class="application-tab" data-view="risk-score"><span>♙</span><b>Risk &amp; Score Breakdown</b></button>
    <button class="application-tab" data-view="application-summary"><span>▤</span><b>Loan Request &amp; Eligibility</b></button>
  </nav>
  <section class="application-context">
    <div class="context-avatar">DC</div>
    <div><strong id="contextCustomer">Application</strong><small id="contextId">Select an application to view live information</small></div>
    <div class="context-status"><span>Application workspace</span><b id="contextStatus">Live data</b></div>
  </section>
  <section class="application-view-wrap"><iframe id="applicationView" title="Application section" loading="eager"></iframe></section>
</main>
<script src="loan-request-eligibility.js"></script>
</body>
</html>
