<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Summary</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#173052;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px}.wrap{padding:2px}.state{border:1px solid #dce4ef;border-radius:8px;padding:18px;background:#fff}.state h2{margin:0 0 5px;font-size:14px}.state p{margin:0;color:#69778d;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.card{border:1px solid #dce4ef;border-radius:8px;padding:12px;background:#fff}.card small{display:block;color:#69778d;font-size:9px;font-weight:700;text-transform:uppercase}.card strong{display:block;margin-top:7px;font-size:20px;color:#173052}.section{border:1px solid #dce4ef;border-radius:8px;padding:13px;margin-top:10px}.section h3{margin:0 0 10px;font-size:11px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f5;padding:6px 0;color:#69778d}.row b{color:#173052}.status{display:inline-block;padding:4px 8px;border-radius:5px;background:#edf8f1;color:#19824b;font-size:9px;font-weight:700}@media(max-width:700px){.grid,.rows{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="wrap" id="app"><div class="state"><h2>Loading application</h2><p>Retrieving live application data…</p></div></div><script src="application-summary.js"></script></body></html>
