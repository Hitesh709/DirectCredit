name: DirectCredit API Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run API smoke tests
        id: smoke
        env:
          PYTHONPATH: .
          DIRECTCREDIT_SECRET: ci-test-secret-change-me-123456789
          ALLOW_DEMO_CREDENTIAL_CLAIM: "false"
        shell: bash
        run: |
          set +e
          pytest -vv tests/api_smoke_test.py tests/task_51_75_smoke.py tests/task_76_100_smoke.py tests/task_111_115_smoke.py tests/test_phase2b_adapters.py tests/test_phase2c_provider_gateway.py tests/test_phase2d_policy.py tests/test_phase2e_offer.py tests/test_phase2f_execution.py tests/test_phase2g_disbursement.py tests/test_phase2h_servicing.py tests/test_phase2i_collections.py tests/test_phase2j_collections_intelligence.py tests/test_phase2k_communication.py 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "pytest_exit_code=${status}" >> pytest-output.txt
          exit ${status}
      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directcredit-smoke-diagnostics
          path: pytest-output.txt
          if-no-files-found: ignore
